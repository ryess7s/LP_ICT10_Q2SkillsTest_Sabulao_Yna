<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
</head>

<style>
.container{background-color: rgba(36, 5, 5, 0.334);
max-width: 1200px;
width: 90%;
margin: 0 auto;
padding: 20px;
box-sizing: border-box;}
.result{background-color: rgba(66, 0, 0, 0.626);   max-width: 1200px;
width: 90%;
margin: 0 auto;
padding: 20px;
box-sizing: border-box;
}

body{background-image: url(red\ background\ ec.jpg);
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    background-attachment: fixed;

    color: white;
    font-family: 'Times New Roman', Times, serif;}
.button{background-color: rgba(0, 0, 0, 0.58);
        color: white;}
.title{background-color: rgba(255, 255, 255, 0.332);
color: rgb(255, 255, 255);
max-width: 1200px;
width: 90%;
margin: 0 auto;
padding: 20px;
box-sizing: border-box;}

</style>
<body>

<div class="title">
    <h1>Non-metal Element Checker</h1>
</div>
<br><br>
    <div class="container">
        <label for="elements" class="form-label">Enter a non-metal name</label>
        <input type="text" id="elements" class="form-control" placeholder="e.g., Oxygen" />
<br>
        <button type="button" class="button" py-click="adding_numbers">
            Look Up Element
        </button>
<br><br>
    </div>
    <br><br>
        <div class="result" id="result">
            <b>Symbol:</b> <br>
            <b>Element:</b> <br>
            <b>Atomic Number:</b> <br>
            <b>Atomic Mass:</b> <br>
        </div>
<script type="py" src="main.py"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
